apiVersion: apps/v1
kind: Deployment

metadata:
  name: sre-go-web-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sre-go-web-app

  template:
    metadata:
      labels:
        app: sre-go-web-app

    spec:
      containers:
        - name: sre-go-web-app

          image: 724413958876.dkr.ecr.us-east-1.amazonaws.com/sre-go-web-app:a8d2a78e1523026e69716c60f1c897647fd12c9d

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15