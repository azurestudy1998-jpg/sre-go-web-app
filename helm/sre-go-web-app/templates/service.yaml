apiVersion: v1
kind: Service

metadata:
  name: {{ include "sre-go-web-app.fullname" . }}

spec:
  selector:
    app: sre-go-web-app

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

  type: {{ .Values.service.type }}